<td class="footer">
  <table class="rbcc footer__main">

    <!-- Closing salutation -->
    <!-- @ifdef signature -->
    <tr>
      <td class="footer__signature" align="left">
        <!-- @echo signature -->
      </td>
    </tr>
    <!-- @endif -->

    <!-- Name + pronouns on one line; padding-bottom separates from title block -->
    <tr>
      <td class="footer__name" align="left">
        <strong><a href="mailto:<!-- @echo contactMail -->"><!-- @echo name --></a></strong> <!-- @ifdef pronouns --><span style="font-size:12px;color:#ddc8d8;font-weight:normal;">(<!-- @echo pronouns -->)</span><!-- @endif -->
      </td>
    </tr>

    <!-- Title and department in one cell with <br> — avoids inter-row gap. Both are optional (e.g. shared team inboxes have neither) -->
    <!-- @ifdef department -->
    <tr>
      <td class="footer__title" align="left">
        <!-- @ifdef title --><!-- @echo title --><br /><!-- @endif --><!-- @echo department -->
      </td>
    </tr>
    <!-- @endif -->

    <!-- Optional phone -->
    <!-- @ifdef phone -->
    <tr>
      <td class="footer__title" align="left">
        <a href="tel:<!-- @echo phone -->"><!-- @echo phone --></a>
      </td>
    </tr>
    <!-- @endif -->

    <!-- Left: disclaimer then icons. Right: logo. -->
    <tr>
      <td>
        <table class="rbcc" width="100%">
          <tr>

            <!-- Left column: disclaimer sits above icons -->
            <!-- padding-top/bottom persist without @media — padding-top adds space above disclaimer,
                 padding-bottom provides gap when this column stacks above the logo on mobile -->
            <td class="footer__social__td" align="left" valign="top" style="padding-top:10px;padding-bottom:16px;">

              <a href="https://www.york.ac.uk/about/legal-statements/email-disclaimer/" class="footer__disclaimer__link" style="display:block;padding-bottom:6px;">Email disclaimer</a>

              <table border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td bgcolor="#ffffff" style="border-radius:50%;padding:8px;"><a href="https://instagram.com/uniofyork" aria-label="Follow us on Instagram" style="display:block;text-decoration:none;"><img src="https://api.iconify.design/fa6-brands/instagram.svg?color=%233c0032&width=18&height=18" alt="Instagram" width="18" height="18" style="border:0;display:block;" /></a></td>
                  <td width="6"></td>
                  <td bgcolor="#ffffff" style="border-radius:50%;padding:8px;"><a href="https://www.linkedin.com/school/UniOfYork" aria-label="Follow us on LinkedIn" style="display:block;text-decoration:none;"><img src="https://api.iconify.design/fa6-brands/linkedin-in.svg?color=%233c0032&width=18&height=18" alt="LinkedIn" width="18" height="18" style="border:0;display:block;" /></a></td>
                  <td width="6"></td>
                  <td bgcolor="#ffffff" style="border-radius:50%;padding:8px;"><a href="https://www.facebook.com/universityofyork" aria-label="Like us on Facebook" style="display:block;text-decoration:none;"><img src="https://api.iconify.design/fa6-brands/facebook-f.svg?color=%233c0032&width=18&height=18" alt="Facebook" width="18" height="18" style="border:0;display:block;" /></a></td>
                  <td width="6"></td>
                  <td bgcolor="#ffffff" style="border-radius:50%;padding:8px;"><a href="https://www.tiktok.com/@uniofyork" aria-label="Follow us on TikTok" style="display:block;text-decoration:none;"><img src="https://api.iconify.design/fa6-brands/tiktok.svg?color=%233c0032&width=18&height=18" alt="TikTok" width="18" height="18" style="border:0;display:block;" /></a></td>
                  <td width="6"></td>
                  <td bgcolor="#ffffff" style="border-radius:50%;padding:8px;"><a href="http://www.youtube.com/universityofyorkuk" aria-label="Watch our videos on YouTube" style="display:block;text-decoration:none;"><img src="https://api.iconify.design/fa6-brands/youtube.svg?color=%233c0032&width=18&height=18" alt="YouTube" width="18" height="18" style="border:0;display:block;" /></a></td>
                </tr>
              </table>

            </td>

            <!-- Right column: logo only, middle-aligned against disclaimer+icons height -->
            <td class="footer__logo__td" align="right" valign="middle">
              <a href="<!-- @echo website -->">
                <img src="<!-- @echo logoUrl -->" alt="<!-- @echo logoAlt -->" class="footer__logo__img" width="160" height="74" />
              </a>
            </td>

          </tr>
        </table>
      </td>
    </tr>

  </table>
</td>
