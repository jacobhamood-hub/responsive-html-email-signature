<!-- @include head.inc.html -->

<body>
  <br /> <!-- Makes it easier to add text when composing -->

  <table class="main rbcc">
    <tr class="sp"><td class="sp__inner"></td></tr>

    <!-- Pre-signature: plain, unbranded line shown above the purple band — e.g. shared-inbox notices that need to be seen before the footer -->
    <!-- @ifdef preSignature -->
    <tr class="rbcc">
      <td class="pre-signature" style="padding:0 24px 12px;">
        <!-- @echo preSignature -->
      </td>
    </tr>
    <!-- @endif -->

    <tr class="rbcc">
      <!-- @include footer.inc.html -->
    </tr>

    <!-- Optional working hours (part-time staff): its own full-width row in the accent colour, below the
         main footer — kept as a sibling row (not nested in .footer) so its background isn't inset by
         .footer's own padding. workingHoursPills is pre-rendered from the conf's "workingHours" string — see tasks/build.js. -->
    <!-- @ifdef workingHoursPills -->
    <tr class="rbcc">
      <td class="footer__hours" align="left">
        <table class="rbcc">
          <tr>
            <td class="footer__hours__label" align="left" valign="middle">Working hours</td>
            <td align="left">
              <table class="rbcc" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <!-- @echo workingHoursPills -->
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <!-- @endif -->
  </table>
</body>
